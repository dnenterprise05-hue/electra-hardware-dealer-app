<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Electra Hardware Connect — dealer app for browsing products, placing orders, and tracking ledger.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Electra Hardware">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme -->
  <meta name="theme-color" content="#0B0B0B">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Loading splash: same as the APK's Android 12+ native splash —
       white Electra Hardware logo centered on pure black. Hands over
       to the Flutter splash on flutter-first-frame. -->
  <style>
    body { background-color: #000000; margin: 0; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background-color: #000000;
      transition: opacity 0.4s ease;
    }
    #loading img {
      width: min(55vw, 260px);
      height: auto;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .eh-splash-seen #loading {
      display: none;
    }
  </style>
  <script>
    // Show the HTML logo screen only once per session, and not at
    // all when launched installed: the WebAPK's own launch splash
    // (app icon on the manifest background_color) has already shown
    // the logo before this page loads. The Flutter service-worker
    // stub may also reload the page once during a version
    // migration; without this guard the logo would repeat.
    try {
      var standalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
      if (standalone || sessionStorage.getItem('ehSplashShown') === '1') {
        document.documentElement.classList.add('eh-splash-seen');
      } else {
        sessionStorage.setItem('ehSplashShown', '1');
      }
    } catch (e) { /* storage unavailable: keep default behavior */ }
  </script>

  <title>Electra Hardware</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading"><img src="splash_logo.png" alt="Electra Hardware"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.classList.add('hidden');
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
